<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SkillSwap</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/index.html" class="nav-brand">SkillSwap</a>
      <div class="nav-links">
        <a href="/register.html">Register</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your SkillSwap account</p>

      <div id="alert" class="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
