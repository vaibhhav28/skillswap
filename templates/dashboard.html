<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SkillSwap</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/index.html" class="nav-brand">SkillSwap</a>
      <div class="nav-links">
        <a href="/dashboard.html" class="active">Dashboard</a>
        <a href="/community.html">Community</a>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- Profile Section -->
    <div class="profile-header">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-info">
        <h2 id="profile-name">Loading…</h2>
        <p id="profile-email"></p>
      </div>
    </div>

      <div class="card mb-16">
        <h3 class="section-title">About Me</h3>

    <div id="bio-alert" class="alert"></div>

    <div class="form-group">
      <label for="bio-input">Bio</label>
      <textarea id="bio-input" placeholder="Write something about yourself..."></textarea>
    </div>

    <button id="save-bio-btn" class="btn btn-outline btn-sm">Save Bio</button>
  </div>

    <!-- Skills -->
    <div class="dashboard-grid">
      <!-- Offer -->
      <div class="card">
        <div class="skills-section-header">
          <span class="skills-label">Skills I Offer</span>
        </div>
        <div id="offer-list" class="chip-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Want -->
      <div class="card">
        <div class="skills-section-header">
          <span class="skills-label">Skills I Want</span>
        </div>
        <div id="want-list" class="chip-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Add Skill -->
    <div class="card mt-24">
      <h3 class="section-title" style="font-size:1rem; color: var(--text); text-transform:none; letter-spacing:0;">Add a Skill</h3>
      <div id="add-alert" class="alert"></div>
      <form id="add-skill-form">
        <div class="add-skill-form">
          <div class="form-group">
            <label for="skill-name">Skill Name</label>
            <input type="text" id="skill-name" placeholder="e.g. Python, Guitar, Spanish…" required />
          </div>
          <div class="form-group" style="max-width:150px;">
            <label for="skill-type">Type</label>
            <select id="skill-type">
              <option value="offer">Offer</option>
              <option value="want">Want</option>
            </select>
          </div>
          <div class="form-group" style="max-width:120px;">
            <label for="skill-level">Level (1–5)</label>
            <input type="number" id="skill-level" min="1" max="5" placeholder="Optional" />
          </div>
          <div class="form-group" style="max-width:140px; align-self:flex-end;">
            <button type="submit" class="btn btn-primary btn-full">Add Skill</button>
          </div>
        </div>
      </form>
    </div>

  </div>

  <footer>
    &copy; 2025 SkillSwap
  </footer>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
