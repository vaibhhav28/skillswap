<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — SkillSwap</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/index.html" class="nav-brand">SkillSwap</a>
      <div class="nav-links">
        <a href="/login.html">Sign In</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <h2>Create your account</h2>
      <p class="subtitle">Join SkillSwap and start exchanging skills</p>

      <div id="alert" class="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Jane Doe" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" required />
          </div>
          <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
